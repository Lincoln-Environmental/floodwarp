name: CPU installation and smoke tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install ".[test,raster,plot]"
      - run: python -m pip check
      - run: python -m examples.run_synthetic
      - run: python -m examples.run_purau
      - run: python -m pytest -q
