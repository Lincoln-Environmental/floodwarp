name: CPU source and built-wheel verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m validation.build_release
      - name: Install actual wheel outside checkout, core only
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/python" -m pip install outputs/release/v0.1.2/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core/bin/python" -m pip check
          "$RUNNER_TEMP/core/bin/python" "$GITHUB_WORKSPACE/validation/installed_smoke.py"
      - name: Install wheel UI extra outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ui"
          wheel=$(realpath outputs/release/v0.1.2/dist/*.whl)
          "$RUNNER_TEMP/ui/bin/python" -m pip install "${wheel}[ui]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ui/bin/python" -m pip check
          "$RUNNER_TEMP/ui/bin/python" "$GITHUB_WORKSPACE/validation/installed_smoke.py"
          "$RUNNER_TEMP/ui/bin/python" "$GITHUB_WORKSPACE/validation/installed_ui_smoke.py"
      - name: Retained source regression suite
        run: |
          python -m pip install '.[test,ui]'
          python -m examples.run_synthetic
          python -m examples.run_purau
          python -m pytest -q
