[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "floodwarp"
version = "0.1.3"
description = "Standalone Warp hydraulic solvers: local inertia and finite-volume shallow water"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md", "DISCLAIMER.md"]
authors = [{name = "Patrick Durney"}, {name = "Lincoln Agritech Ltd"}]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]
requires-python = ">=3.14"
dependencies = ["numpy==2.3.5", "scipy==1.16.3", "numba==0.67.0", "warp-lang==1.17.0"]

[project.optional-dependencies]
ui = ["rasterio>=1.4", "matplotlib>=3.10", "pyogrio>=0.13", "shapely>=2.2", "pyproj>=3.8"]
raster = ["rasterio>=1.4"]
plot = ["matplotlib>=3.10"]
test = ["pytest==9.1.1"]
cuda = ["warp-lang==1.17.0"]
profile = ["nvtx==0.2.16"]

[project.urls]
Homepage = "https://github.com/Lincoln-Environmental/floodwarp"
Repository = "https://github.com/Lincoln-Environmental/floodwarp"
Issues = "https://github.com/Lincoln-Environmental/floodwarp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
floodwarp = ["ui_assets/*", "ui_assets/example/*", "_build_info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
