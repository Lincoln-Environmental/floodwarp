[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "floodwarp"
version = "0.1.0.dev0"
description = "Standalone Warp hydraulic solvers: local inertia and finite-volume shallow water"
requires-python = ">=3.14"
dependencies = ["numpy==2.3.5", "scipy==1.16.3", "numba==0.67.0", "warp-lang==1.17.0"]

[project.optional-dependencies]
raster = ["rasterio>=1.4"]
plot = ["matplotlib>=3.10"]
test = ["pytest==9.1.1"]
cuda = ["warp-lang==1.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
